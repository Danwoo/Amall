<!DOCTYPE html>
<!-- Default Layout Import-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout/defaultLayout}"
	layout:fragment="Content">
<head>
<title>WishList</title>

<!-- inline CSS 영역-->
<link th:inline="css" th:href="@{/css/wishList.css}" rel="stylesheet" />
<style type="text/css">
.content {
	width: 960px;
	margin: auto;
}
</style>

<!-- inline JS 영역-->
<script th:inline="javascript" type="text/javascript" th:src="@{/js/wishlist-handler.js}"></script>

<!-- 회원 ID 주입 (JavaScript에서 사용) -->
<meta name="member-id" th:content="${#authentication.name}" sec:authorize="isAuthenticated()">
</head>

<body>
	<div layout:fragment="content" class="content">
		<div class="container">
			<div id="banner">
				<h2>WishList</h2>
			</div>
			<div id="myWish">
				<h3>나의 관심상품</h3>
			</div>
			<div class="tabcontent">
				<div class="miniContainer">
					<div class="showItem">
						<div th:each="myWish : ${myWishList}" class="itemInfor">
							<div class="itemImage">
								<img th:src="${myWish.PROD_IMAGE1}">
							</div>
							<div class="itemExplanation">
								<h6 th:text="${myWish.SELLER_ID}"></h6>
								<h5 th:text="${myWish.PROD_NAME}"></h5>
								<nav>
								<a class="like"> <img src="img/imgCommon/Good.png">
									</a>
								</nav>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div th:switch="${checkSolo}">
				<div th:case="0" class="solo">저런... 아직도 솔로세요?</div>
				<div th:case="1" class="solo">신발도 짝이 있는데...</div>
				<div th:case="2" class="solo">호그와트 입학 준비중이세요?</div>
				<div th:case="3" class="solo">저 근데... 모솔은... 아니죠?</div>
				<div th:case="4" class="solo">풉!</div>
				<div th:case="5" class="soloLink" onclick="window.open('https://www.netflix.com/kr/title/81436209')">https://www.netflix.com/kr/title/81436209</div>
				<div th:case="6" class="solo">아자아자! 30년 할 수 있다!</div>
				<div th:case="7" class="soloLink" onclick="window.open('https://www.youtube.com/watch?v=KJSXolyj4DM')">https://www.youtube.com/watch?v=KJSXolyj4DM</div>
				<div th:case="8" class="solo"><img src="/img/imgCommon/solo1.png"></div>
				<div th:case="9" class="solo">풉!</div>
  			</div>
			<div th:if="${checkCouple}" id="yourWish">
				<h3>너의 관심상품</h3>
			</div>
			<div class="tabcontent">
				<div class="miniContainer">
					<div class="showItem">
						<div th:each="yourWish : ${yourWishList}" class="itemInfor">
							<div class="itemImage">
								<img th:src="${yourWish.PROD_IMAGE1}">
							</div>
							<div class="itemExplanation">
								<h6 th:text="${yourWish.SELLER_ID}"></h6>
								<h5 th:text="${yourWish.PROD_NAME}"></h5>
								<nav>
								<a class="like"> <img src="img/imgCommon/Good.png">
									</a>
								</nav>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- 선물하기 모달 (Phase 9-3) -->
		<div id="giftModal" class="gift-modal" style="display: none;">
			<div class="gift-modal-content">
				<span class="gift-modal-close">&times;</span>
				<h2>선물하기 🎁</h2>
				<form id="giftForm">
					<input type="hidden" id="giftProdNum">
					<input type="hidden" id="giftToMemberId" th:value="${#authentication.principal.memberMatchId}" sec:authorize="isAuthenticated()">

					<div class="form-group">
						<label>상품명:</label>
						<p id="giftProdName" style="font-weight: bold;"></p>
					</div>

					<div class="form-group">
						<label for="giftQuantity">수량:</label>
						<input type="number" id="giftQuantity" name="quantity" min="1" value="1" required>
					</div>

					<div class="form-group">
						<label for="giftMessage">선물 메시지 (선택):</label>
						<textarea id="giftMessage" name="giftMessage" rows="4" maxlength="500" placeholder="사랑하는 당신에게..."></textarea>
					</div>

					<div class="form-actions">
						<button type="button" class="btn-cancel" onclick="closeGiftModal()">취소</button>
						<button type="submit" class="btn-submit">장바구니에 추가</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<!-- 선물하기 모달 스타일 -->
	<style>
		.gift-button {
			background-color: #ff6b6b;
			color: white;
			border: none;
			padding: 8px 16px;
			border-radius: 4px;
			cursor: pointer;
			font-size: 14px;
			margin-top: 8px;
			transition: background-color 0.3s;
		}

		.gift-button:hover {
			background-color: #ff5252;
		}

		.gift-modal {
			display: none;
			position: fixed;
			z-index: 1000;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			overflow: auto;
			background-color: rgba(0, 0, 0, 0.4);
		}

		.gift-modal-content {
			background-color: #fefefe;
			margin: 10% auto;
			padding: 30px;
			border: 1px solid #888;
			border-radius: 8px;
			width: 500px;
			max-width: 90%;
		}

		.gift-modal-close {
			color: #aaa;
			float: right;
			font-size: 28px;
			font-weight: bold;
			cursor: pointer;
		}

		.gift-modal-close:hover,
		.gift-modal-close:focus {
			color: black;
		}

		.gift-modal h2 {
			margin-top: 0;
			color: #333;
		}

		.form-group {
			margin-bottom: 20px;
		}

		.form-group label {
			display: block;
			margin-bottom: 8px;
			font-weight: bold;
			color: #555;
		}

		.form-group input[type="number"],
		.form-group textarea {
			width: 100%;
			padding: 10px;
			border: 1px solid #ddd;
			border-radius: 4px;
			font-size: 14px;
			box-sizing: border-box;
		}

		.form-group textarea {
			resize: vertical;
			font-family: inherit;
		}

		.form-actions {
			display: flex;
			gap: 10px;
			justify-content: flex-end;
			margin-top: 20px;
		}

		.btn-cancel,
		.btn-submit {
			padding: 10px 20px;
			border: none;
			border-radius: 4px;
			cursor: pointer;
			font-size: 14px;
			transition: background-color 0.3s;
		}

		.btn-cancel {
			background-color: #e0e0e0;
			color: #333;
		}

		.btn-cancel:hover {
			background-color: #d0d0d0;
		}

		.btn-submit {
			background-color: #4CAF50;
			color: white;
		}

		.btn-submit:hover {
			background-color: #45a049;
		}
	</style>
</body>
</html>
